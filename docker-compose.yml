services:
  postgres:
    image: postgres:16-alpine
    container_name: neolytics-postgres
    environment:
      POSTGRES_DB: neolytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - neolytics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neolytics"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: neolytics-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - neolytics-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neolytics-postgres-data:
  neolytics-redis-data:
